# Dependency updates, opened as pull requests so CI decides them.
#
# This is the one place in the project where a machine is allowed to propose a
# change to `Cargo.lock` and to the workflow pins. It is worth stating why that is
# not in tension with the offline promise: `swp` itself opens no socket and fetches
# nothing at run time, and a dependency bump is a source change that the same
# suites then test. The direct dependency list is twenty-one lines and `cargo tree`
# contains no HTTP client anywhere, which is a property worth keeping, so an update
# that adds a crate gets read rather than merged.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Etc/UTC
    # Every direct dependency belongs to a group below, and a group opens one pull
    # request rather than one per crate. `update-types` stops the group at minor and
    # patch on purpose: without it a group happily bundles a major — this
    # configuration once proposed moving `zip` from 2 to 8 inside a group named
    # "containers", which is a review decision arriving dressed as housekeeping.
    # Leaving a group does not make a major invisible. An update that matches no
    # group rule is raised individually, so a major arrives as its own single-crate
    # pull request for a person to read. That is the right outcome and it is also
    # the reason for the limit below.
    groups:
      rustcrypto:
        patterns:
          - sha2
          - hmac
          - subtle
          - zeroize
          - ed25519-dalek
          - getrandom
        update-types:
          - minor
          - patch
      grammars:
        patterns:
          - tree-sitter
          - tree-sitter-javascript
          - tree-sitter-typescript
          - tree-sitter-python
        update-types:
          - minor
          - patch
      containers:
        patterns:
          - zip
          - tar
          - flate2
        update-types:
          - minor
          - patch
      # The catch-all. A dependency nobody listed is exactly the kind of thing that
      # should not be allowed to arrive as its own pull request every Tuesday.
      everything-else:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # This is not "four groups, four pull requests". The limit counts open
    # version-update pull requests for the whole cargo entry — grouped and
    # individual together — which is what keeps the ungrouped majors mentioned
    # above from arriving six at a time on a Tuesday.
    open-pull-requests-limit: 4
    commit-message:
      prefix: deps
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Majors included here, unlike the Rust groups: an action's major *is* the
    # maintenance — `actions/checkout` 4 still runs on a Node runtime GitHub has
    # deprecated, and refusing majors would pin the whole workflow set to a runtime
    # on its way out. Grouped, that arrives as one reviewable pull request a month
    # instead of three.
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - dependencies
