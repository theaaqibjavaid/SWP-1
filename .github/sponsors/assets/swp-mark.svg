<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="SWP-1 mark: a grid of source literals with four keyed sites connected">
  <title>SWP-1</title>
  <desc>
    A field of identical positions, four of which carry a watermark. The four are
    joined to one another: a fragment on its own proves nothing, and it is the
    set that carries the evidence. This is the same shape the protocol's
    constellation selection produces, so the mark is the method.
  </desc>

  <rect width="240" height="240" rx="28" fill="#0B1220"/>
  <rect x="0.5" y="0.5" width="239" height="239" rx="28" fill="none" stroke="#223049"/>

  <!-- the unkeyed field -->
  <g fill="#2A3B57">
    <circle cx="44"  cy="44"  r="5"/><circle cx="84"  cy="44"  r="5"/>
    <circle cx="124" cy="44"  r="5"/><circle cx="164"  cy="44"  r="5"/>
    <circle cx="44"  cy="84"  r="5"/><circle cx="124" cy="84"  r="5"/>
    <circle cx="196" cy="84"  r="5"/><circle cx="84"  cy="124" r="5"/>
    <circle cx="196" cy="124" r="5"/><circle cx="44"  cy="164" r="5"/>
    <circle cx="124" cy="164" r="5"/><circle cx="196" cy="164" r="5"/>
    <circle cx="44"  cy="196" r="5"/><circle cx="84"  cy="196" r="5"/>
    <circle cx="164" cy="196" r="5"/>
  </g>

  <!-- the keyed sites, and the edges that join them into one finding -->
  <g stroke="#7FD4C1" stroke-width="3" fill="none" opacity="0.85">
    <path d="M84 44 L164 84 L164 164 L84 124 Z"/>
  </g>
  <g fill="#7FD4C1">
    <circle cx="84"  cy="44"  r="8"/>
    <circle cx="164" cy="84"  r="8"/>
    <circle cx="164" cy="164" r="8"/>
    <circle cx="84"  cy="124" r="8"/>
  </g>
  <g fill="none" stroke="#0B1220" stroke-width="3">
    <circle cx="84"  cy="44"  r="3"/>
    <circle cx="164" cy="84"  r="3"/>
    <circle cx="164" cy="164" r="3"/>
    <circle cx="84"  cy="124" r="3"/>
  </g>
</svg>
