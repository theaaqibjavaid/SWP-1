<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="SWP-1 — Universal Source Provenance Watermark System. Open source under Apache-2.0. Sponsor its maintenance on GitHub Sponsors.">
  <title>SWP-1 — sponsor the maintenance</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101B2E"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .h    { font-size: 84px; font-weight: 700; fill: #E6EDF7; }
      .sub  { font-size: 26px; fill: #93A4C0; }
      .tag  { font-size: 21px; fill: #C7D4E8; }
      .cta  { font-size: 26px; font-weight: 700; fill: #0B1220; }
      .url  { font-size: 18px; fill: #7FD4C1; }
    </style>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="398" fill="none" stroke="#223049" stroke-width="2"/>

  <!-- the mark, at 148px -->
  <g transform="translate(72,126) scale(0.6167)">
    <rect width="240" height="240" rx="28" fill="#0E1729" stroke="#223049"/>
    <g fill="#2A3B57">
      <circle cx="44"  cy="44"  r="5"/><circle cx="84"  cy="44"  r="5"/>
      <circle cx="124" cy="44"  r="5"/><circle cx="164"  cy="44"  r="5"/>
      <circle cx="44"  cy="84"  r="5"/><circle cx="124" cy="84"  r="5"/>
      <circle cx="196" cy="84"  r="5"/><circle cx="84"  cy="124" r="5"/>
      <circle cx="196" cy="124" r="5"/><circle cx="44"  cy="164" r="5"/>
      <circle cx="124" cy="164" r="5"/><circle cx="196" cy="164" r="5"/>
      <circle cx="44"  cy="196" r="5"/><circle cx="84"  cy="196" r="5"/>
      <circle cx="164" cy="196" r="5"/>
    </g>
    <path d="M84 44 L164 84 L164 164 L84 124 Z" stroke="#7FD4C1" stroke-width="3" fill="none" opacity="0.85"/>
    <g fill="#7FD4C1">
      <circle cx="84" cy="44" r="8"/><circle cx="164" cy="84" r="8"/>
      <circle cx="164" cy="164" r="8"/><circle cx="84" cy="124" r="8"/>
    </g>
  </g>

  <!-- title block: x 292 .. 1000. Nothing here crosses 1040, where the CTA starts. -->
  <text class="mono h"   x="292" y="168">SWP-1</text>
  <text class="mono sub" x="292" y="210">Universal Source Provenance</text>
  <text class="mono sub" x="292" y="242">Watermark System</text>

  <line x1="292" y1="272" x2="960" y2="272" stroke="#223049"/>

  <text class="mono tag" x="292" y="308">Apache-2.0 · offline · no telemetry</text>
  <text class="mono tag" x="292" y="340">JavaScript · TypeScript · Python</text>

  <!-- call to action -->
  <g transform="translate(1040,140)">
    <rect width="440" height="60" rx="30" fill="#7FD4C1"/>
    <text class="mono cta" x="220" y="39" text-anchor="middle">Sponsor the maintenance</text>
    <text class="mono url" x="220" y="104" text-anchor="middle">github.com/sponsors/theaaqibjavaid</text>
    <text class="mono tag" x="220" y="140" text-anchor="middle" font-size="19" fill="#93A4C0">The software is free either way.</text>
  </g>
</svg>
