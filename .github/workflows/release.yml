name: Release

# Push a tag `v*` and this builds the release binaries for four targets, checks
# they are the version the tag says, and publishes a GitHub Release whose notes
# come out of `CHANGELOG.md` rather than out of a model's head.
#
# Deliberately not included here: publishing to crates.io. A registry publish is
# permanent in a way a binary upload is not — it can be yanked, never removed — so
# it is a separate, manually started workflow (`publish.yml`) rather than something
# a tag does by itself.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v1.0.0
        required: true
        type: string

# `checks` and `build` only read the tree, so only the job that creates a release
# carries a write token. The build jobs compile and run third-party build scripts
# from the tagged commit; giving them write access to the repository would make a
# defect in one of them a defect with consequences.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: is this release the version it claims
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.agree.outputs.version }}
      tag: ${{ steps.agree.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A tag push checks out the tag; a manual run checks out the tag it names,
          # so the manifest and changelog it reads are the tagged ones.
          ref: ${{ inputs.tag || github.ref }}
      - name: tag, manifest and changelog must agree
        id: agree
        env:
          REPO: ${{ github.repository }}
          # The dispatch input is a string a human typed into a form. Interpolating
          # it into the script below would let that string be shell rather than a
          # tag name, so it arrives as a variable and is checked before use.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "'$TAG' is not a release tag: a tag name is a v followed by digits."
              echo "This value comes from the workflow's form, and it names the build"
              echo "everything downstream is checked against."
              exit 1 ;;
          esac
          VERSION="${TAG#v}"
          MANIFEST=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >>"$GITHUB_OUTPUT"

          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "tag says v$VERSION, Cargo.toml says $MANIFEST."
            echo "A release binary and a crate published under the same number have"
            echo "to be the same build. Fix one of them, in the tagged commit."
            exit 1
          fi

          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no [${VERSION}] section."
            echo "The release notes on a GitHub Release are that section; a release"
            echo "with no entry is a release nobody can reason about later."
            exit 1
          fi

          # The address a crate would carry into the registry index, read from the
          # tagged manifest rather than assumed, against the repository this run is
          # actually happening in. A fork that copies this tree without editing
          # `Cargo.toml` would publish crates pointing at somebody else's tree, and
          # release notes built from `${REPO}` would link to this one — so the two
          # have to be named the same place, which is what this checks.
          MANIFEST_REPO=$(sed -n 's|^repository = "https://github\.[a-z]*/\([^/]*/[^/]*\)"$|\1|p' Cargo.toml | head -n1)
          if [ "$MANIFEST_REPO" != "$REPO" ]; then
            echo "Cargo.toml says this source lives at github.com/${MANIFEST_REPO:-nowhere},"
            echo "but the release is running in github.com/$REPO."
            exit 1
          fi

          # An unfilled field in a legal or policy page is the same class of bug as
          # a placeholder URL: it reads as finished and is not. That scan lives in
          # `scripts/check-release.sh`, which runs as the next step — a checklist
          # duplicated here would be a second checklist to fall out of agreement with
          # the first, which is the failure this project keeps writing gates against.
          echo "v$VERSION is consistent, and it is this repository's."

      # The same gate `ci.yml` runs on every pull request, run again against the
      # tagged commit: a tag can be cut from a commit that never passed CI, and the
      # thing it checks — licence files, publishable manifests, the published
      # address, unfilled legal fields, tier drift — is exactly what a release makes
      # public. Offline packaging needs the dependencies on disk, hence the fetch.
      - name: the publication checklist, on the tagged tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          sh scripts/check-release.sh

  build:
    name: build (${{ matrix.artifact }})
    needs: checks
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            binary: swp.exe
            archive: zip
          - os: ubuntu-latest
            artifact: linux-x64
            binary: swp
            archive: tar
          - os: macos-latest
            # `macos-latest` is Apple Silicon, so the artifact says so. A build is
            # named for the machine it ran on: relabeling an arm64 binary as x86_64
            # is the one mistake a release artifact cannot survive, because the
            # failure happens on the user's machine and not in this log.
            artifact: macos-aarch64
            binary: swp
            archive: tar
          - os: macos-15-intel
            # The Intel runner: `macos-13`, the last one before it, is retired. If
            # this label goes too, delete this entry and the row for it in the
            # release notes below rather than re-pointing it at an ARM machine — an
            # x86_64 macOS build has to be cross-compiled or built on Intel, and
            # neither is assumed here. An unbuildable target is a missing artifact
            # somebody can see; an ARM binary labelled x86_64 is not.
            artifact: macos-x64
            binary: swp
            archive: tar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        shell: bash
        run: cargo build --release --locked -p swp-cli

      - name: what did we just build
        shell: bash
        run: |
          set -euo pipefail
          out="$(./target/release/${{ matrix.binary }} --version)"
          echo "$out"
          # The binary prints its own version, so a build that linked the wrong
          # crate says so here rather than in somebody's issue three weeks later.
          case "$out" in
            *"swp $VERSION"*) ;;
            *)
              echo "the binary does not report version $VERSION."
              echo "Either the tag and the manifest disagree, or this ran on a"
              echo "checkout that is not the one the checks job verified."
              exit 1 ;;
          esac

      - name: assemble (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = $env:VERSION
          New-Item -ItemType Directory -Force -Path dist, staging | Out-Null
          Copy-Item target/release/${{ matrix.binary }} staging/
          Copy-Item LICENSE, NOTICE, README.md, CHANGELOG.md staging/
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          "swp $VERSION · $env:ARTIFACT · built $stamp" | Set-Content staging/BUILD
          Compress-Archive -Path staging/* -DestinationPath "dist/swp-$VERSION-windows-x64.zip"
        env:
          ARTIFACT: ${{ matrix.artifact }}

      - name: assemble (unix)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp "target/release/${{ matrix.binary }}" staging/
          cp LICENSE NOTICE README.md CHANGELOG.md staging/
          printf 'swp %s · %s · built %s\n' "$VERSION" "${{ matrix.artifact }}" "$(date -u +%FT%TZ)" \
            > staging/BUILD
          tar -czf "dist/swp-${VERSION}-${{ matrix.artifact }}.tar.gz" -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish the release
    needs: [checks, build]
    runs-on: ubuntu-latest
    # The only job here that writes: it creates the Release and uploads to it. The
    # build jobs stay read-only because they run third-party build scripts.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.checks.outputs.tag }}
      VERSION: ${{ needs.checks.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: checksums and notes
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum swp-* > SHA256SUMS
          cat SHA256SUMS

      - name: write the release body
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## What shipped in ${VERSION}"
            echo
            awk -v want="## [${VERSION}]" '
              index($0, want) == 1 { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' CHANGELOG.md | sed '/./,$!d'
            echo
            echo "## Binaries"
            echo
            echo "Each archive holds the executable plus \`LICENSE\`, \`NOTICE\`,"
            echo "\`README.md\`, \`CHANGELOG.md\` and a \`BUILD\` line naming the version,"
            echo "the target and the time it was compiled."
            echo
            echo "| file | platform |"
            echo "| --- | --- |"
            echo "| \`swp-${VERSION}-windows-x64.zip\` | Windows 10/11, x86_64 |"
            echo "| \`swp-${VERSION}-linux-x64.tar.gz\` | Linux, glibc x86_64 |"
            echo "| \`swp-${VERSION}-macos-aarch64.tar.gz\` | macOS, Apple Silicon |"
            echo "| \`swp-${VERSION}-macos-x64.tar.gz\` | macOS, Intel |"
            echo
            echo "Verify before you run anything:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
            echo
            echo "The binaries are built from the source you can build yourself with"
            echo "\`cargo install --path crates/swp-cli --locked\`. Nothing in this"
            echo "project asks you to take a build on trust, and"
            echo "[docs/VALIDATION.md](https://github.com/${REPO}/blob/v${VERSION}/docs/VALIDATION.md)"
            echo "records a clean-environment installation of exactly that command."
            echo
            echo "A note on the guarantee, because it differs by platform:"
            echo "[SECURITY.md](https://github.com/${REPO}/blob/v${VERSION}/SECURITY.md)"
            echo "and"
            echo "[docs/SECURITY.md](https://github.com/${REPO}/blob/v${VERSION}/docs/SECURITY.md)"
            echo "— on Windows the root secret is sealed with DPAPI under your own"
            echo "credential; on Linux and macOS it is a file with 0600 permissions and"
            echo "is not encrypted at rest. A store sealed on Windows cannot be opened"
            echo "on either of the others."
          } > release-notes.md
          cat release-notes.md

      - name: create or update the release
        shell: bash
        run: |
          set -euo pipefail
          TITLE="swp ${VERSION}"
          PRERELEASE=()
          case "$VERSION" in
            *-*) PRERELEASE=(--prerelease) ;;
          esac
          # No --latest: GitHub already points "latest" at the newest stable,
          # non-draft release, and a pre-release that asked for it would be both
          # pre-release and latest — a contradiction in one flag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" \
              --notes-file release-notes.md "${PRERELEASE[@]+"${PRERELEASE[@]}"}"
          else
            gh release create "$TAG" --title "$TITLE" \
              --notes-file release-notes.md "${PRERELEASE[@]+"${PRERELEASE[@]}"}"
          fi
          cd artifacts
          for f in swp-* SHA256SUMS; do
            gh release upload "$TAG" "$f" --clobber
          done
