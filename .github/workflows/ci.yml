name: CI

# Everything a change has to survive before it is merged. The rules are the ones in
# CONTRIBUTING.md, and the point of running them here rather than in a reviewer's
# head is that two of them — the documentation transcripts and the secret-leak
# sweep — are the project's actual guarantees rather than conventions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: check formatting
        run: cargo fmt --all --check
        shell: bash

  clippy:
    name: lints (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # `-D warnings` rather than RUSTFLAGS, so a build script of a grammar crate
      # cannot fail the run for a lint nobody wrote.
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        shell: bash

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --locked
        shell: bash
      # The point of three operating systems: secret sealing and permission
      # hardening differ by platform (`seal.rs`, `harden_permissions`), and the
      # suites classify what they found rather than assume a platform. Note what
      # this job cannot catch — a document describing the Windows guarantee as a
      # general one. That is review's job.
      - name: test
        run: cargo test --workspace --locked --no-fail-fast
        shell: bash

  secret-leak:
    name: the secret stays out of everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Separate from the `test` matrix on purpose. It is the one suite whose
      # failure means the project's central promise broke, so it gets its own line
      # in the checks list rather than a row inside five hundred passing tests.
      - name: sweep
        run: cargo test --locked -p swp-test-suite --test secret_leak
        shell: bash

  docs-are-true:
    name: every documented transcript still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # README.md, every page under docs/, and the four example transcripts.
      # A stale example fails the build; a number that varies with the key is
      # elided as `…` rather than invented.
      - name: re-run the console blocks
        run: cargo test --locked -p swp-test-suite --test docs_examples
        shell: bash

  binding-python:
    name: python binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      # Windows runners run steps in PowerShell by default, and none of these is
      # a PowerShell idiom; every step here is spelled once and read on all three
      # operating systems.
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      # `python -m pip` is spelled out rather than using the `pip` console
      # script, so the command reads identically on a runner where `pip` might
      # be shadowed by a different Python's entry point. The binding is its own
      # workspace (see bindings/python/Cargo.toml §[workspace]): an empty table
      # keeps it out of the repository's, and the toolchain PyO3 asks for is
      # newer than the `rust-version` the published crates advertise.
      - name: build the wheel
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --locked -j 2
      # `target/wheels/*.whl` is a glob; on a Windows runner a PowerShell step
      # would expand it with Windows rules, and the spell would need quoting to
      # read on every platform. The job's `shell: bash` keeps one spelling.
      - name: install and run the suite
        working-directory: bindings/python
        run: |
          python -m pip install --force-reinstall target/wheels/*.whl pytest
          pytest -q

  binding-node:
    name: node binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      # As in the Python job: Windows runners would otherwise run these steps in
      # PowerShell, and every command below is spelled once for all three systems.
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # 20 is the floor `package.json` declares in `engines`, not the runner's
      # default: the addon is built against Node-API 4 and resolves its entries from
      # the host, so the oldest supported interpreter is the one worth testing.
      # As of 2026-10-03 this request is not the version that runs — every job
      # reports `Node.js 20 is deprecated … forced to run on Node.js 24` from
      # setup-node@v4 — so the floor is asked for and not yet measured. Whether an
      # exact 20.x version would reach the runner is untested here, and raising the
      # request is a release decision: it belongs in the binding's README, not in a
      # workflow edit made under a red check.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      # `npm ci` rather than `npm install`: the lockfile is the decision, and a
      # build that can drift from it is a build whose `@napi-rs/cli` is not the one
      # that generated `binding.cjs` and `binding.d.ts` in this commit.
      - name: install the toolchain the package declares
        working-directory: bindings/node
        run: npm ci
      # The binding is its own Cargo workspace, so the repository's `fmt` and
      # `clippy` jobs never see it. `-j 2` is the ceiling the rest of this
      # repository's CI commands use.
      - name: lint the addon crate
        working-directory: bindings/node
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -j 2 -- -D warnings
      # `napi build` shells out to Cargo with no `--locked` of its own and no way to
      # pass one through, so the locked build happens first and `napi build` then
      # reuses it and only names the artifact for this platform.
      - name: build the addon
        working-directory: bindings/node
        run: |
          cargo build --release --locked -j 2
          npm run build
      # `npm test` is `node --test` with no path: the runner walks the package for
      # `*.test.mjs`. Given a path it does not expand a directory, it tries to run
      # it, and `node --test tests/` fails with MODULE_NOT_FOUND.
      - name: run the suite
        working-directory: bindings/node
        run: npm test
      - name: check the declarations compile
        working-directory: bindings/node
        run: npm run typecheck

  release-readiness:
    name: release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # check-release.sh packages every manifest with `--offline`, which is the only
      # honest way to ask whether a crate resolves against what the index really has.
      # On a runner with a cold registry cache the answer is "nothing resolves",
      # which is a property of the runner rather than of the manifests — so the
      # dependencies are fetched first, and the offline flag then means what it says.
      - name: fill the registry cache
        run: cargo fetch --locked
        shell: bash
      - name: check
        run: sh scripts/check-release.sh
        shell: bash
