[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
repository = ""
publish = false

[workspace.dependencies]
swp-core = { path = "crates/swp-core" }
swp-crypto = { path = "crates/swp-crypto" }
swp-identity = { path = "crates/swp-identity" }
swp-manifest = { path = "crates/swp-manifest" }
swp-embedding = { path = "crates/swp-embedding" }
swp-detection = { path = "crates/swp-detection" }
swp-evidence = { path = "crates/swp-evidence" }
swp-adapters = { path = "crates/swp-adapters" }
swp-cli = { path = "crates/swp-cli" }
swp-test-suite = { path = "crates/swp-test-suite" }

# The product's whole third-party surface, and every line of it is a decision
# rather than a default. Nothing here reaches a network: `cargo tree` has no HTTP
# client, and `swp` opens no socket in any code path. `swp-cli`'s argument parser
# is hand-written in `args.rs` for the same reason — a smaller supply chain to
# audit is the point of a tool whose promise is offline.
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.3"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
unicode-normalization = "0.1"
base64 = "0.22"
toml = "0.8"

tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
