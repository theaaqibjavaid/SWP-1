[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
# The address below is the published location of the public tree, and the one
# string here that a build cannot verify: `scripts/check-release.sh` prints it
# alongside the version so a release is checked against it rather than assumed.
repository = "https://github.com/theaaqibjavaid/SWP-1"
documentation = "https://github.com/theaaqibjavaid/SWP-1/tree/main/docs"
keywords = ["watermarking", "provenance", "supply-chain", "code-analysis", "cli"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
publish = ["crates.io"]

[workspace.dependencies]
# The internal crates carry a `version` as well as a `path` because a registry
# release is built from the published tarball, where `path` does not exist: with
# only a path, `cargo package` refuses to write a manifest whose dependencies
# name no version. The two are kept in step by `scripts/check-release.sh`, which
# fails if a `version` here ever disagrees with `[workspace.package]`.
swp-core = { path = "crates/swp-core", version = "1.0.0" }
swp-crypto = { path = "crates/swp-crypto", version = "1.0.0" }
swp-identity = { path = "crates/swp-identity", version = "1.0.0" }
swp-manifest = { path = "crates/swp-manifest", version = "1.0.0" }
swp-embedding = { path = "crates/swp-embedding", version = "1.0.0" }
swp-detection = { path = "crates/swp-detection", version = "1.0.0" }
swp-evidence = { path = "crates/swp-evidence", version = "1.0.0" }
swp-adapters = { path = "crates/swp-adapters", version = "1.0.0" }
swp-cli = { path = "crates/swp-cli", version = "1.0.0" }
# Never published, so it needs no version to be published under.
swp-test-suite = { path = "crates/swp-test-suite" }

# The product's whole third-party surface, and every line of it is a decision
# rather than a default. Nothing here reaches a network: `cargo tree` has no HTTP
# client, and `swp` opens no socket in any code path. `swp-cli`'s argument parser
# is hand-written in `args.rs` for the same reason — a smaller supply chain to
# audit is the point of a tool whose promise is offline.
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.3"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
walkdir = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
unicode-normalization = "0.1"
base64 = "0.22"
toml = "0.8"

tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
